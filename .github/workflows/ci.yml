name: ci

# 契约一致性 + 密钥扫描 + 构建/单测 + e2e + （可选）接口验收矩阵
# 注：后端(mvn)/前端(pnpm) 步骤在后端与前端工程落地后自动生效（带 if 守卫）。
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_acceptance:
        description: '同时运行 Note §9 接口验收矩阵（会启动后端 + SQLite）'
        type: boolean
        default: false

jobs:
  contract:
    name: contract & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install tooling deps
        run: npm -C scripts install --no-audit --no-fund
      - name: contract consistency (openapi ↔ docs ↔ ErrorCode/fixtures)
        run: node scripts/check-contract.mjs

  security:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: frontend install
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: |
          corepack enable
          pnpm -C frontend install --frozen-lockfile
      - name: frontend typecheck
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: pnpm -C frontend exec vue-tsc --noEmit
      - name: frontend unit tests (vitest)
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: pnpm -C frontend test
      - name: frontend build
        if: ${{ hashFiles('frontend/package.json') != '' }}
        run: pnpm -C frontend build
      - name: backend verify (unit + integration tests, single artifact jar)
        if: ${{ hashFiles('backend/pom.xml') != '' }}
        run: mvn -B -f backend/pom.xml verify

  e2e:
    name: e2e (playwright + visual regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: e2e（MSW 直连 fixtures + 视觉回归基线；CI 用随附 Chromium）
        if: ${{ hashFiles('frontend/playwright.config.ts') != '' }}
        run: |
          corepack enable
          pnpm -C frontend install --frozen-lockfile
          pnpm -C frontend exec playwright install --with-deps chromium
          pnpm -C frontend test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ failure() && hashFiles('frontend/playwright.config.ts') != '' }}
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  acceptance:
    name: note matrix (§9 acceptance)
    # 手动触发（workflow_dispatch + run_acceptance=true）：需要真实后端进程与 SQLite 数据
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_acceptance }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLUEBIRD_API: http://localhost:8080/api/v1
      BLUEBIRD_DB: backend/data/bluebird.db
      MATRIX_OUT: scripts/acceptance/matrix-out
      MANAGER_CAN_READ_SUBORDINATE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: boot backend (SQLite, subordinate read on)
        run: |
          nohup mvn -B -q -f backend/pom.xml -DskipTests spring-boot:run > /tmp/backend.log 2>&1 &
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/users/me || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then echo "backend up ($code)"; exit 0; fi
            sleep 2
          done
          echo 'backend did not start'; tail -80 /tmp/backend.log; exit 1
      - name: seed acceptance accounts
        run: python3 scripts/acceptance/seed_accounts.py
      - name: run matrix (exit code 0 = all passed)
        run: python3 scripts/acceptance/matrix_main.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: note-matrix-result
          path: scripts/acceptance/matrix-out/
          retention-days: 14
