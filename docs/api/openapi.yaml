openapi: 3.0.3
info:
  title: BlueBird Task API
  version: 0.1.0
  description: >
    蓝鸟任务系统 **目标态** API 契约（单一事实源，针对重构后的新系统；**非现有系统**——现有系统为 `/task/record/*` 裸 `Page`/裸实体、成功码由前端按「缺失即 200」解释，见 `docs/frontend-baseline/fixtures/legacy-api/`）。
    统一前缀 `/api/v1`；统一响应 `ApiResult{code,message,data,traceId}`。成功/业务失败 **HTTP 200**（业务码表达结果，见 `02 §1.3`）；
    鉴权与资源定位失败改用真实 HTTP 状态：`401`（未认证）、`403`（无权限，body 仍为 `ApiResult` 且 `code` 为 5xxxx/对应业务码）、`404`（资源不存在或不可见）、`400`（参数/请求体校验失败）、`409`（冲突，如附件仍被引用）。
    错误码区间（枚举权威源 `02 §1.4` + `docs/Note模块后端开发方案.md`）：`1xxxx=common`、`2xxxx=identity`、`3xxxx=task`、`4xxxx=file`、`5xxxx=note`、`6xxxx=org/同步`。
    时间统一 ISO8601 + `+08:00`。详见 `Task/02后端模块详细设计.md`。
    约定：用户/个人数据响应统一 `Cache-Control: no-store`；秘密一律不入 URL（token 走 `Authorization` 头，密码/密钥走请求体；query 仅非敏感参数）。
servers:
  - url: /api/v1
    description: 同源（单制品内嵌前端，ADR-009）
tags:
  - name: auth
  - name: user
  - name: org
  - name: task
  - name: note
  - name: tag
  - name: menu
  - name: file
  - name: audit
  - name: job
  - name: scim
  - name: admin

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: 账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Token' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 token（匿名，凭 refresh token）
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RefreshReq' } } }
      responses:
        '200': { $ref: '#/components/responses/Token' }
  /auth/external/config:
    get:
      tags: [auth]
      summary: 当前认证提供方配置（前端据此渲染登录入口）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - properties:
                      data:
                        type: object
                        properties:
                          provider: { type: string, enum: [LOCAL, OIDC, WECHAT] }
                          corpId: { type: string, nullable: true }
                          agentId: { type: string, nullable: true }
                          authorizeUrl:
                            type: string
                            nullable: true
                            description: OIDC 时返回，前端整页跳转的登录入口（`/api/v1/auth/oidc/redirect`）
                          displayName:
                            type: string
                            nullable: true
                            description: 登录按钮文案（如 Casdoor）
                          logoutUrl:
                            type: string
                            nullable: true
                            description: 上游统一登出地址，前端登出后可整页跳转
  /auth/oidc/redirect:
    get:
      tags: [auth]
      summary: 发起 Casdoor 单点登录（302 跳转上游 authorize）
      description: >
        生成随机 `state` 并写入 httpOnly cookie（`bb_oidc_state`，10 分钟），随后 302 到 Casdoor
        `/login/oauth/authorize`。`redirect` 为登录成功后回跳的前端路径（默认 `/index`，仅接受站内绝对路径）。
      security: []
      parameters:
        - { name: redirect, in: query, schema: { type: string }, description: 登录成功后的前端回跳路径 }
      responses:
        '302': { description: 重定向到 Casdoor 授权页 }
  /auth/oidc/callback:
    get:
      tags: [auth]
      summary: Casdoor 回调（浏览器整页跳转，非 XHR）
      description: >
        校验 `state` → 用 `code` 换 token → 拉 `userinfo` → 本地用户 upsert（角色/部门映射）→ 签发本地 token，
        最后 302 到 `/oauth/success#access_token=..&refresh_token=..&redirect=..`（hash 传参，不进服务端日志）。
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        '302': { description: 重定向回前端（成功带 token，失败带 error） }
  /bootstrap/admin:
    post:
      tags: [auth]
      summary: 一次性引导创建首 ADMIN（仅空库可用，R25）
      description: >
        仅当系统中尚无 ADMIN 时可用；否则返回 403。成功返回新 ADMIN 的 id（data）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, description: 缺省 admin }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /users:
    get:
      tags: [user]
      summary: 用户列表（人员选择器；手机号脱敏）
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [subordinate] }, description: subordinate=当前用户的下属（递归下级部门成员），用于日志授权/主管视图；此时忽略其余过滤参数 }
        - { name: deptId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string }, description: 按 username 或 name 模糊匹配 }
        - name: includeSubDept
          in: query
          schema: { type: boolean, default: false }
          description: deptId 是否视为部门子树（含下级部门）。大型组织（数千部门）中间层节点通常无直属成员，人员选择器需传 true
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/UserPage' }
    post:
      tags: [user]
      summary: 新增用户（ADMIN）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserCreateReq' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /users/me:
    get:
      tags: [user]
      summary: 当前用户
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/UserVO' } } }]
  /users/{id}/password:
    put:
      tags: [user]
      summary: 修改密码（首登 must_change_password 引导）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PasswordUpdateReq' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /users/{id}:
    put:
      tags: [user]
      summary: 更新用户（ADMIN）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserUpdateReq' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete: { tags: [user], summary: 禁用/删除用户（ADMIN）, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /departments:
    get:
      tags: [org]
      summary: 部门树
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Department' } } } }]
    post:
      tags: [org]
      summary: 新增部门（ADMIN）
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeptCreateReq' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /departments/export:
    get:
      tags: [org]
      summary: 导出部门（.xlsx，ADMIN/USER_MANAGER）
      description: |
        导出全部部门为 Excel。列：部门名称、上级部门（全路径）、排序、负责人账号；
        上级部门写**全路径**（如 `XX公司/研发中心`），因此「导出 → 修改 → 导入」可闭环。
      responses:
        '200':
          description: xlsx 文件流
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /departments/import-template:
    get:
      tags: [org]
      summary: 下载部门导入模板（.xlsx）
      description: 含表头、示例行与「填写说明」工作表，供用户填写后导入。
      responses:
        '200':
          description: xlsx 文件流
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /departments/import:
    post:
      tags: [org]
      summary: 导入部门（.xlsx，ADMIN/USER_MANAGER）
      description: |
        先**全量校验**：只要有一行不通过就整份不导入，`data.ok=false` 并给出每行原因（`row` 为 Excel 1-based 行号）。
        同一上级下同名的部门视为**更新**（排序/负责人），不会重复创建；父部门须已存在或在本文件中排在子部门之前。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/DeptImportResult' } } }]
  /departments/{id}:
    put:
      tags: [org]
      summary: 修改部门（含 `leaderId`，ADMIN）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeptUpdateReq' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete: { tags: [org], summary: 删除部门（有子级/有成员则拒绝，ADMIN）, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /org/sync:
    post: { tags: [org], summary: 手动同步（PULL 模式，ADMIN）, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /org/sync/status:
    get:
      tags: [org]
      summary: 同步状态（ADMIN）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/SyncStatus' } } }]
  /org/sync/logs:
    get:
      tags: [org]
      summary: 组织同步日志分页（ADMIN / AUDITOR）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/OrgSyncLogPage' } } }]
  /org/sync/latest:
    get:
      tags: [org]
      summary: 最近一次同步记录（ADMIN / AUDITOR / USER_MANAGER）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/OrgSyncLogVO' } } }]
  /org/push:
    post:
      tags: [org]
      summary: 私有 IDM 推送（独立 SecurityFilterChain 校验 Bearer ORGSYNC_PUSH_TOKEN）
      description: >
        被动接收私有 IDM（竹云等）的组织/用户推送并 upsert（幂等，以外部源 id 映射；不删实体，仅将移除者置 DISABLED）。
        下方为**规范通用报文**；具体厂商私有格式由 `OrgPushAdapter` 解析映射（`02 §3.3`）。
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrgPushPayload' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /scim/v2/Users:
    get:
      tags: [scim]
      summary: SCIM 查询用户（`app.orgsync.mode=SCIM`；独立 SecurityFilterChain 校验 Bearer ORGSYNC_PUSH_TOKEN，ADR-008）
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [scim]
      summary: SCIM 创建用户（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimResource' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put:
      tags: [scim]
      summary: SCIM 替换用户（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimResource' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [scim]
      summary: SCIM 局部更新用户（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimPatchOp' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [scim]
      summary: SCIM 删除用户（SCIM 模式）
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /scim/v2/Groups:
    get:
      tags: [scim]
      summary: SCIM 查询部门（SCIM 模式；Group 按名称映射为 sys_department，02 §3.3）
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    post:
      tags: [scim]
      summary: SCIM 创建部门（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimResource' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    put:
      tags: [scim]
      summary: SCIM 替换部门（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimResource' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    patch:
      tags: [scim]
      summary: SCIM 局部更新部门（SCIM 模式）
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScimPatchOp' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [scim]
      summary: SCIM 删除部门（SCIM 模式）
      security: []
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /jobs/{name}/run:
    post:
      tags: [job]
      summary: 手动重跑调度任务（ADMIN；`sys_job_log` 记录，0306/Q6）
      parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /jobs/logs:
    get:
      tags: [job]
      summary: 调度任务日志分页（ADMIN）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/JobLogPage' } } }]

  /admin/config:
    get:
      tags: [admin]
      summary: 全部配置分组（ADMIN；密文只返回掩码）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/ConfigGroupVO' } } } }]
  /admin/config/{group}:
    get:
      tags: [admin]
      summary: 单个配置分组（ADMIN）
      parameters: [{ name: group, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/ConfigGroupVO' } } }]
    put:
      tags: [admin]
      summary: 保存配置分组（ADMIN；值为 null/掩码视为不修改，空串表示清空）
      parameters: [{ name: group, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ConfigSaveReq' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/ConfigGroupVO' } } }]
  /admin/config/casdoor/test:
    post:
      tags: [admin]
      summary: 测试 Casdoor 连通性（ADMIN；拉 .well-known/openid-configuration）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/ConfigTestResult' } } }]

  /tasks:
    get:
      tags: [task]
      summary: 任务列表（各视图）
      parameters:
        - { name: scope, in: query, required: true, schema: { $ref: '#/components/schemas/Scope' } }
        - { name: keyword, in: query, schema: { type: string }, description: 匹配 title/content（大小写不敏感子串） }
        - { name: subordinate, in: query, schema: { type: boolean, default: false }, description: 仅 scope=all 生效；主管筛选其（含递归子部门）下属相关任务，只读（ADR-012） }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: menuId, in: query, schema: { type: integer, format: int64 }, description: 按自定义栏条目过滤（仅本人栏） }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { $ref: '#/components/responses/TaskPage' }
    post:
      tags: [task]
      summary: 新建主任务
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskCreateReq' } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
  /tasks/search:
    get:
      tags: [task]
      summary: 任务检索（note 引用选择器；仅返回当前用户可见任务，分页）
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/TaskSearchData' } } }]
  /tasks/count:
    get:
      tags: [task]
      summary: 各视图计数（recurring 按展开实例）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - properties:
                      data: { $ref: '#/components/schemas/CountVO' }
  /tasks/calendar:
    get:
      tags: [task]
      summary: 日历区间（有任务日期/实例）
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/TaskList' }
  /tasks/subtasks:
    get:
      tags: [task]
      summary: 子任务列表
      parameters: [{ name: parentId, in: query, required: true, schema: { type: integer, format: int64 } }]
      responses:
        '200': { $ref: '#/components/responses/TaskList' }
  /tasks/{id}:
    get:
      tags: [task]
      summary: 任务详情
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/TaskDetailVO' } } }]
    put:
      tags: [task]
      summary: 更新任务（须携带 `version`）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TaskUpdateReq' } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [task]
      summary: 软删除（不可逆：清空关联数据；见 R5）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tasks/{id}/complete:
    post:
      tags: [task]
      summary: 完成任务（周期任务可传 dueAt 指定实例，见 R2；更新须携带 version）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCompleteReq'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tasks/{id}/uncomplete:
    post:
      tags: [task]
      summary: 取消完成（周期任务可传 dueAt；更新须携带 version）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCompleteReq'
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tasks/{id}/collect:
    post:
      tags: [task]
      summary: 收藏
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [task]
      summary: 取消收藏
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /tags:
    get:
      tags: [tag]
      summary: 我的标签
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/TagVO' } } } }]
    post:
      tags: [tag]
      summary: 新增标签
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagReq' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tags/{id}:
    put:
      tags: [tag]
      summary: 改标签
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TagReq' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete: { tags: [tag], summary: 删标签, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /menus:
    get:
      tags: [menu]
      summary: 我的自定义栏
      parameters:
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/Menu' } } } }]
    post: { tags: [menu], summary: 新增栏, requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuReq' } } } }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /menus/{id}:
    put: { tags: [menu], summary: 改栏, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuReq' } } } }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
    delete: { tags: [menu], summary: 删栏, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /menus/{id}/items:
    post: { tags: [menu], summary: 添加任务到栏, parameters: [{ $ref: '#/components/parameters/Id' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemReq' } } } }, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /menus/{id}/items/{itemId}:
    delete:
      tags: [menu]
      summary: 从栏移除任务
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: itemId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }

  /files:
    post:
      tags: [file]
      summary: 通用上传（note 附件前置；`taskId` 非空 → 400，task 附件走 /tasks/{taskId}/attachments）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                taskId:
                  type: integer
                  format: int64
                  nullable: true
                  description: 禁止使用；非空即 400（TASK_ATTACHMENT_FORBIDDEN）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/FileVO' } } }]
  /files/config:
    get:
      tags: [file]
      summary: 上传约束（大小/扩展名白名单，前端预校验用）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - properties:
                      data:
                        type: object
                        properties:
                          maxSize: { type: integer, format: int64, description: 单文件字节上限 }
                          allowedExt: { type: array, items: { type: string } }
  /files/{id}:
    get:
      tags: [file]
      summary: 通用下载（登录 + 附件访问权：task 引用走任务可见，note 引用走日志可见，无引用仅创建者/ADMIN）
      description: 引用同步保护的附件（task 或 note 引用存在）在无引用的通用下载语境下对非创建者 403。
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { description: 文件流 }
        '403': { description: 无通用下载权限 }
        '404': { description: 附件不存在 }
    delete:
      tags: [file]
      summary: 删除附件（引用保护：仍有 task/note 引用 → 409）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { description: 附件仍被引用（4xxxx） }
  /files/{id}/preview:
    get:
      tags: [file]
      summary: 预览（与下载同权限；后端按 id 代理，修 SSRF）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: 文件流 } }

  /tasks/{taskId}/attachments:
    post:
      tags: [task, file]
      summary: 上传并绑定任务附件（需任务写权限）
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/FileVO' } } }]
  /tasks/{taskId}/attachments/{attachmentId}:
    delete:
      tags: [task, file]
      summary: 解除并删除任务附件（需任务写权限；创建者或 ADMIN 可物理删除，否则仅解绑）
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /tasks/{taskId}/attachments/{attachmentId}/download:
    get:
      tags: [task, file]
      summary: 任务附件下载（任务可见即可）
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses: { '200': { description: 文件流 } }
  /tasks/{taskId}/attachments/{attachmentId}/preview:
    get:
      tags: [task, file]
      summary: 任务附件预览（任务可见即可）
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses: { '200': { description: 文件流 } }

  /notes:
    get:
      tags: [note]
      summary: 工作日志分页（7 种 scope + 过滤/排序）
      description: >
        `scope`：`mine`（默认）| `shared`（他人共享给我）| `explore`（PUBLIC）| `internal`（本部门 INTERNAL）|
        `subordinate`（下属日志，需开关 `app.security.manager-can-read-subordinate`）| `visible`（全部可见）| `all`（ADMIN）。
        `tagId` 精确匹配；`tagName` 模糊；`date` 与 `start/end` 互斥。`sort`：`log_date_desc`（默认）| `log_date_asc` | `created_desc` | `updated_desc`（注意：`pinned` 由后端恒定作为第一排序键，`pinned_first` 不存在，传驼峰 `logDate_*` 会被忽略而回落默认）。
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [mine, shared, explore, internal, subordinate, visible, all], default: mine } }
        - { name: tagId, in: query, schema: { type: integer, format: int64 } }
        - { name: tagName, in: query, schema: { type: string } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: visibility, in: query, schema: { type: string, enum: [PRIVATE, INTERNAL, PUBLIC] } }
        - { name: pinned, in: query, schema: { type: boolean } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: sort, in: query, schema: { type: string, enum: [log_date_desc, log_date_asc, created_desc, updated_desc], default: log_date_desc } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteListData' } } }]
        '400': { description: 参数非法（日期/枚举/scope+date 冲突） }
        '403': { description: scope 无权限（all / subordinate 开关关闭） }
    post:
      tags: [note]
      summary: 新建工作日志
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteCreateReq' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteDetailVO' } } }]
  /notes/tags:
    get:
      tags: [note]
      summary: 标签 facet（mine 返回 id，其他 scope 返回 name + count）
      parameters:
        - { name: scope, in: query, schema: { type: string, default: mine } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteTagFacetItem' } } } }]
  /notes/calendar:
    get:
      tags: [note]
      summary: 日历聚合（按日计数）
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: scope, in: query, schema: { type: string, default: mine } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteCalendarDay' } } } }]
  /notes/{id}:
    get:
      tags: [note]
      summary: 日志详情（含引用/被引/附件/ownerTags）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteDetailVO' } } }]
        '404': { description: 不存在或不可见（含归档且非 owner/ADMIN） }
    put:
      tags: [note]
      summary: 修改日志（owner/ADMIN/EDITOR；乐观锁 version）
      description: >
        归档日志：owner/ADMIN 仍可修改；EDITOR 返回 **HTTP 200 + code 50013**（归档只读，明确提示而非 404）。
        未获授权的用户仍按不可见处理（404）。
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteUpdateReq' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteDetailVO' } } }]
        '403': { description: 无编辑权（VIEWER/非授权） }
        '404': { description: 不可见 }
        '409': { description: 版本冲突（10006）或归档只读 }
    delete:
      tags: [note]
      summary: 删除日志（owner/ADMIN；逻辑删除并级联清理关联表）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: 无管理权 }
        '404': { description: 不可见 }
  /notes/{id}/pin:
    post:
      tags: [note]
      summary: 置顶
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
    delete:
      tags: [note]
      summary: 取消置顶
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notes/{id}/archive:
    post:
      tags: [note]
      summary: 归档（owner/ADMIN）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { description: 无管理权 }
        '404': { description: 不可见 }
  /notes/{id}/unarchive:
    post:
      tags: [note]
      summary: 取消归档（owner/ADMIN）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notes/{id}/relations:
    get:
      tags: [note]
      summary: 出向引用列表
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteRelationVO' } } } }]
    post:
      tags: [note]
      summary: 新增引用（幂等；自引用 400；目标不可见 400/404）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteRelationCreateReq' } } } }
      responses:
        '200':
          description: OK（已存在时返回既有引用）
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteRelationVO' } } }]
        '400': { description: 自引用/目标类型非法/目标不可见 }
  /notes/{id}/relations/{relationId}:
    delete:
      tags: [note]
      summary: 删除引用（创建者/源日志 owner/ADMIN）
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: relationId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notes/{id}/backlinks:
    get:
      tags: [note]
      summary: 被引用列表（谁引用了我）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteBacklinkVO' } } } }]
        '404': { description: 不可见 }
  /notes/{id}/attachments:
    get:
      tags: [note]
      summary: 附件列表（可见即可）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteAttachmentVO' } } } }]
    post:
      tags: [note]
      summary: 绑定附件（幂等；需写权限；仅允许本人上传且未被 task 引用的附件）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteAttachmentBindReq' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteAttachmentVO' } } }]
        '400': { description: 附件不可绑定 }
        '403': { description: 无写权限 }
  /notes/{id}/attachments/{attachmentId}:
    delete:
      tags: [note]
      summary: 解除附件引用（保留文件；写权限）
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /notes/{id}/attachments/{attachmentId}/download:
    get:
      tags: [note]
      summary: 附件下载（日志可见即可）
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/AttachmentId' }
      responses: { '200': { description: 文件流 } }

  /note-grants:
    get:
      tags: [note]
      summary: 授权列表
      description: >
        `tab=created`（我发起的申请）| `granted`（我作为日志主人的授权）| `incoming`（他人向我申请/授权给我）| `all`（ADMIN）。
      parameters:
        - { name: tab, in: query, schema: { type: string, enum: [created, granted, incoming, all], default: created } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, APPROVED, REJECTED, REVOKED] } }
        - { name: role, in: query, schema: { type: string, enum: [VIEWER, EDITOR] } }
        - { name: mode, in: query, schema: { type: string, enum: [OWNER, SUPERIOR, ADMIN] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: array, items: { $ref: '#/components/schemas/NoteUserGrantVO' } } } }]
    post:
      tags: [note]
      summary: 发起授权（mode=OWNER 直接生效；SUPERIOR 需下属审批；ADMIN 直接生效）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NoteUserGrantReq' } } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/NoteUserGrantVO' } } }]
        '400': { description: 参数非法（角色/模式/用户） }
        '403': { description: 无发起权 }
  /note-grants/{id}/approve:
    post:
      tags: [note]
      summary: 通过申请（仅 grantor，即日志主人；写 approved_by/approved_at）
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK（返回 NoteUserGrantVO） } }
  /note-grants/{id}/reject:
    post:
      tags: [note]
      summary: 拒绝申请
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK（返回 NoteUserGrantVO） } }
  /note-grants/{id}/upgrade:
    post:
      tags: [note]
      summary: VIEWER → EDITOR 升级
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK（返回 NoteUserGrantVO） } }
  /note-grants/{id}:
    delete:
      tags: [note]
      summary: 撤销授权
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses: { '200': { description: OK（返回 NoteUserGrantVO） } }

  /audit/operates:
    get:
      tags: [audit]
      summary: 操作日志分页（ADMIN / AUDITOR）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/OperateLogPage' } } }]
  /audit/logins:
    get:
      tags: [audit]
      summary: 登录/退出日志分页（ADMIN / AUDITOR）
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: provider, in: query, schema: { type: string, enum: [LOCAL, CASDOOR] }, description: 认证来源筛选 }
        - { name: eventType, in: query, schema: { type: string, enum: [LOGIN, LOGOUT] }, description: 事件类型筛选 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/LoginLogPage' } } }]

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResult' }
    Token:
      description: Token pair
      content:
        application/json:
          schema:
            allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/TokenVO' } } }]
    TaskList:
      description: 任务列表
      content:
        application/json:
          schema:
            allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/TaskListData' } } }]
    TaskPage:
      description: 任务分页
      content:
        application/json:
          schema:
            allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { $ref: '#/components/schemas/TaskListData' } } }]
    UserPage:
      description: 用户分页
      content:
        application/json:
          schema:
            allOf: [{ $ref: '#/components/schemas/ApiResult' }, { properties: { data: { type: object, properties: { list: { type: array, items: { $ref: '#/components/schemas/UserVO' } }, total: { type: integer } } } } }]

  schemas:
    ApiResult:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { nullable: true }
        traceId: { type: string, nullable: true }
    TokenVO:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        mustChangePassword: { type: boolean }
    Scope:
      type: string
      enum: [day, assigned, joined, collect, all]
    Priority:
      type: string
      description: 任务优先级（4 值，与 01 §8.1 / 02 DDL 对齐）。
      enum: [LOW, MEDIUM, HIGH, URGENT]
    TaskStatus:
      type: string
      enum: [ACTIVE, DISABLED, ARCHIVED]
    CountVO:
      type: object
      description: 各视图计数。**键名映射旧系统**：`joined`=旧 `join`、`assigned`=旧 `do`（0304/S5）；其余同。
      properties:
        day: { type: integer }
        joined: { type: integer }
        assigned: { type: integer }
        collect: { type: integer }
        all: { type: integer }
    CycleRule:
      type: object
      description: 周期规则（TEXT 存 JSON，计算式展开；02 §4.3）
      required: [freq, interval, dtstart, tz]
      properties:
        freq: { type: string, enum: [DAILY, WEEKLY, MONTHLY] }
        interval: { type: integer, minimum: 1, default: 1 }
        dtstart: { type: string, format: date-time }
        byDay: { type: array, items: { type: string, enum: [MO, TU, WE, TH, FR, SA, SU] }, nullable: true, description: 仅 WEEKLY 生效 }
        count: { type: integer, nullable: true, description: 与 until 互斥 }
        until: { type: string, format: date, nullable: true, description: 最后发生日期（含）；与 count 互斥。日期粒度（截至该日当地时区） }
        tz: { type: string, default: Asia/Shanghai }
    UserBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    UserVO:
      allOf:
        - $ref: '#/components/schemas/UserBrief'
        - type: object
          properties:
            username: { type: string }
            mobile: { type: string, description: 手机号；ADMIN/USER_MANAGER 取得明文（用于编辑），其余角色脱敏 138****0000 }
            email: { type: string, description: 邮箱 }
            deptId: { type: integer, format: int64 }
            deptName: { type: string }
            roleCode: { type: string, enum: [ADMIN, AUDITOR, USER_MANAGER, COMMON] }
            managerCanReadSubordinate:
              type: boolean
              description: 是否开启「上级可读下属日志」；前端据此显隐 note「下属日志」导航与 scope 选项
    TagVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    FileVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string }
        size: { type: integer, format: int64 }
        md5: { type: string }
        downloadUrl:
          type: string
          description: 上下文相关相对路径（task 上下文为 /tasks/{taskId}/attachments/{id}/download；通用为 /files/{id}），前端以 axios blob 取流
        createdBy: { type: integer, format: int64 }
        canDelete: { type: boolean, description: 可物理删除（创建者/ADMIN，不含引用保护） }
        canRemoveFromTask:
          type: boolean
          nullable: true
          description: task 附件上下文专用（assertWritable && (createdBy==me||isAdmin)）；其他上下文为 null
    TaskSearchData:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/TaskSearchItem' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    TaskSearchItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { type: string }
        dueAt: { type: string, format: date-time, nullable: true }
    NoteBrief:
      type: object
      description: 列表项（contentSummary 为正文前 200 码位，保留换行、不补省略号）
      properties:
        id: { type: integer, format: int64 }
        contentSummary: { type: string }
        logDate: { type: string, format: date, description: YYYY-MM-DD }
        visibility: { type: string, enum: [PRIVATE, INTERNAL, PUBLIC] }
        pinned: { type: boolean }
        archived: { type: boolean }
        ownerId: { type: integer, format: int64 }
        ownerName: { type: string }
        tags: { type: array, items: { $ref: '#/components/schemas/TagVO' } }
        canEdit: { type: boolean }
        canManage: { type: boolean }
        version: { type: integer, format: int64 }
    NoteVO:
      allOf:
        - $ref: '#/components/schemas/NoteBrief'
        - type: object
          properties:
            content: { type: string, description: 完整正文（仅详情返回） }
            ownerDept: { type: string, nullable: true }
            grantRole: { type: string, nullable: true, enum: [VIEWER, EDITOR, OWNER, ADMIN] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    NoteDetailVO:
      allOf:
        - $ref: '#/components/schemas/NoteVO'
        - type: object
          properties:
            relations: { type: array, items: { $ref: '#/components/schemas/NoteRelationVO' } }
            backlinks: { type: array, items: { $ref: '#/components/schemas/NoteBacklinkVO' } }
            attachments: { type: array, items: { $ref: '#/components/schemas/NoteAttachmentVO' } }
            ownerTags:
              type: array
              nullable: true
              description: owner 完整标签；仅 canEdit / canManage 时返回
              items: { $ref: '#/components/schemas/TagVO' }
    NoteListData:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/NoteBrief' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    NoteCreateReq:
      type: object
      required: [content, logDate]
      properties:
        content: { type: string }
        logDate: { type: string, format: date, description: YYYY-MM-DD（严格解析，非法 400） }
        visibility: { type: string, enum: [PRIVATE, INTERNAL, PUBLIC], default: PRIVATE }
        tagIds: { type: array, items: { type: integer, format: int64 } }
    NoteUpdateReq:
      type: object
      description: 字段均可省略（null=不改）；提供 version 时做乐观锁校验
      properties:
        content: { type: string }
        logDate: { type: string, format: date }
        visibility: { type: string, enum: [PRIVATE, INTERNAL, PUBLIC] }
        tagIds: { type: array, items: { type: integer, format: int64 }, description: 提供即整体替换为给定集合 }
        version: { type: integer, format: int64 }
    NoteRelationCreateReq:
      type: object
      required: [targetType, targetId]
      properties:
        targetType: { type: string, enum: [NOTE, TASK] }
        targetId: { type: integer, format: int64 }
    NoteRelationVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        targetType: { type: string, enum: [NOTE, TASK] }
        targetId: { type: integer, format: int64 }
        targetSummary: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, description: 引用时间 }
        createdBy: { type: integer, format: int64 }
        createdByName: { type: string }
    NoteBacklinkVO:
      type: object
      properties:
        relationId: { type: integer, format: int64 }
        sourceNoteId: { type: integer, format: int64 }
        sourceSummary: { type: string }
        sourceOwnerId: { type: integer, format: int64 }
        sourceOwnerName: { type: string }
        createdAt: { type: string, format: date-time, description: 引用时间 }
        createdBy: { type: integer, format: int64 }
        createdByName: { type: string }
    NoteAttachmentBindReq:
      type: object
      required: [attachmentId]
      properties:
        attachmentId: { type: integer, format: int64 }
    NoteAttachmentVO:
      type: object
      properties:
        id: { type: integer, format: int64, description: note_attachment_ref.id }
        attachmentId: { type: integer, format: int64 }
        fileName: { type: string }
        size: { type: integer, format: int64 }
        contentType: { type: string, nullable: true }
        downloadUrl: { type: string, description: '/notes/{id}/attachments/{attachmentId}/download' }
        createdAt: { type: string, format: date-time, description: 附件上传时间（取自 attachment 表，非关联时间） }
        createdBy: { type: integer, format: int64 }
        createdByName: { type: string }
        canRemoveRef: { type: boolean }
        canDelete: { type: boolean }
    NoteTagFacetItem:
      type: object
      description: mine 返回 id；其他 scope 返回 name + count
      properties:
        id: { type: integer, format: int64, nullable: true }
        name: { type: string }
        count: { type: integer }
    NoteCalendarDay:
      type: object
      properties:
        date: { type: string, format: date }
        count: { type: integer }
    NoteUserGrantReq:
      type: object
      required: [mode, role]
      description: >
        `OWNER`：日志主人授权他人，`grantorId` 必须省略（服务端取当前用户），`granteeId` 必填，立即 APPROVED；
        `SUPERIOR`：主管申请下属日志，`grantorId`=下属（必须是自己下属）、`granteeId` 必须省略（推导为当前用户），落 PENDING；
        `ADMIN`：`grantorId`/`granteeId` 均必填，立即 APPROVED。
      properties:
        mode: { type: string, enum: [OWNER, SUPERIOR, ADMIN], description: OWNER=日志主人授权；SUPERIOR=主管申请下属日志；ADMIN=管理员授权 }
        grantorId: { type: integer, format: int64, description: 日志主人（SUPERIOR/ADMIN 必填，OWNER 禁填） }
        granteeId: { type: integer, format: int64, description: 被授权人（OWNER/ADMIN 必填，SUPERIOR 禁填） }
        role: { type: string, enum: [VIEWER, EDITOR] }
    NoteUserGrantVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        grantorId: { type: integer, format: int64 }
        grantorName: { type: string }
        granteeId: { type: integer, format: int64 }
        granteeName: { type: string }
        role: { type: string, enum: [VIEWER, EDITOR] }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, REVOKED] }
        mode: { type: string, enum: [OWNER, SUPERIOR, ADMIN] }
        direction: { type: string, enum: [outgoing, incoming, none], description: 'outgoing=我是日志主人；incoming=他人向我授权/申请；none=ADMIN 视角' }
        createdBy: { type: integer, format: int64 }
        createdByName: { type: string }
        createdAt: { type: string, format: date-time }
        approvedBy: { type: integer, format: int64, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        revokedBy: { type: integer, format: int64, nullable: true }
        canApprove: { type: boolean }
        canReject: { type: boolean }
        canUpgrade: { type: boolean }
        canRevoke: { type: boolean }
    TaskVO:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        completed: { type: boolean }
        dueAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        cycleRule: { allOf: [{ $ref: '#/components/schemas/CycleRule' }], nullable: true }
        cycleLastCompleted: { type: string, format: date-time, nullable: true }
        owner: { $ref: '#/components/schemas/UserBrief' }
        assignees: { type: array, items: { $ref: '#/components/schemas/UserBrief' } }
        ccUsers: { type: array, items: { $ref: '#/components/schemas/UserBrief' } }
        participantIds: { type: array, items: { type: integer, format: int64 } }
        version: { type: integer, format: int64, description: 乐观锁版本号（更新须回传；失配 code=10006，ADR-013） }
        tags: { type: array, items: { $ref: '#/components/schemas/TagVO' } }
        subtaskCompleted: { type: integer }
        subtaskTotal: { type: integer }
        files: { type: array, items: { $ref: '#/components/schemas/FileVO' } }
        createdAt: { type: string, format: date-time }
    TaskDetailVO:
      allOf:
        - $ref: '#/components/schemas/TaskVO'
        - type: object
          properties:
            subtasks: { type: array, items: { $ref: '#/components/schemas/TaskVO' } }
    TaskCreateReq:
      type: object
      required: [title]
      properties:
        title: { type: string }
        content: { type: string }
        version: { type: integer, format: int64, description: 更新（PUT）时必填乐观锁版本；新建省略（ADR-013） }
        dueAt: { type: string, format: date-time, nullable: true }
        remindAt: { type: string, format: date-time, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
        cycleRule: { allOf: [{ $ref: '#/components/schemas/CycleRule' }], nullable: true }
        assigneeIds: { type: array, items: { type: integer, format: int64 } }
        ccIds: { type: array, items: { type: integer, format: int64 } }
        tagIds: { type: array, items: { type: integer, format: int64 } }
        fileIds: { type: array, items: { type: integer, format: int64 } }
    TaskListData:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/TaskVO' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    TaskBrief:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        completed: { type: boolean }
        dueAt: { type: string, format: date-time, nullable: true }
        priority: { $ref: '#/components/schemas/Priority' }
    MenuItem:
      type: object
      description: 自定义栏条目（引用任务）
      properties:
        id: { type: integer, format: int64 }
        menuId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        sort: { type: integer }
        task: { allOf: [{ $ref: '#/components/schemas/TaskBrief' }], description: 冗余任务摘要，供栏内直接渲染 }
    Menu:
      type: object
      description: 自定义栏（GET /menus 返回，含条目）
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64, description: 所属用户（菜单私有） }
        name: { type: string }
        sort: { type: integer }
        createdAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
    Department:
      type: object
      description: 部门树节点（GET /departments 返回，嵌套 children）
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        leaderId: { type: integer, format: int64, nullable: true, description: 部门负责人用户 id（组织级可见性，ADR-012） }
        sort: { type: integer }
        system: { type: boolean, description: 系统默认顶级部门：可改名，不可删除 }
        children: { type: array, items: { $ref: '#/components/schemas/Department' } }
    DeptImportResult:
      type: object
      description: 部门导入结果。`ok=false` 表示整份未导入（全量校验未通过）
      required: [ok, total, created, updated, failed, errors]
      properties:
        ok: { type: boolean }
        total: { type: integer, description: 数据行总数 }
        created: { type: integer }
        updated: { type: integer }
        failed: { type: integer, description: 校验失败行数 }
        errors:
          type: array
          items:
            type: object
            required: [row, message]
            properties:
              row: { type: integer, description: Excel 1-based 行号（表头为第 1 行） }
              message: { type: string }
    OperateLogVO:
      type: object
      description: 操作日志（ADMIN / AUDITOR）。字段对应 `02 §6.2` 表 `audit_operate_log`（module/action/uri/method/user_id/ip/user_agent/duration/status/msg）。
      properties:
        id: { type: integer, format: int64 }
        module: { type: string, description: 业务模块（如 task/identity/org/file/audit） }
        action: { type: string, description: 操作（如 complete/delete） }
        uri: { type: string, description: 请求路径（对应表 uri） }
        method: { type: string, description: HTTP 方法 }
        userId: { type: integer, format: int64, description: 操作人（对应表 user_id） }
        username: { type: string }
        ip: { type: string }
        userAgent: { type: string, description: 对应表 user_agent }
        duration: { type: integer, format: int64, description: 耗时 ms（对应表 duration） }
        status: { type: string, enum: [SUCCESS, FAILURE], description: 结果：SUCCESS 成功 / FAILURE 失败（应用层由表 status 0/1 映射，1 成功 0 失败） }
        msg: { type: string, description: 结果信息/异常摘要（对应表 msg） }
        createdAt: { type: string, format: date-time }
    LoginLogVO:
      type: object
      description: 登录/退出日志（ADMIN / AUDITOR）。字段对应 `02 §6.2` 表 `audit_login_log`。
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        success: { type: boolean, description: 是否成功（对应表 success；1 成功 0 失败） }
        ip: { type: string }
        userAgent: { type: string, description: 对应表 user_agent }
        provider:
          type: string
          nullable: true
          enum: [LOCAL, CASDOOR]
          description: 认证来源；历史数据为 null
        eventType:
          type: string
          nullable: true
          enum: [LOGIN, LOGOUT]
          description: 事件类型；历史数据为 null（按 LOGIN 处理）
        externalId: { type: string, nullable: true, description: 外部身份源用户 id（Casdoor sub） }
        createdAt: { type: string, format: date-time }
    OperateLogPage:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/OperateLogVO' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    LoginLogPage:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/LoginLogVO' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    SyncStatus:
      type: object
      description: 组织同步状态（orgsync）
      properties:
        running: { type: boolean }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastResult: { type: string, nullable: true }
        mode: { type: string, enum: [NONE, SCIM, PULL, PUSH] }
    OrgSyncLogVO:
      type: object
      description: 组织同步日志（后台日志页）
      properties:
        id: { type: integer, format: int64 }
        source: { type: string, description: 数据源（casdoor / idm / scim） }
        syncType: { type: string, description: PULL / PUSH / SCIM / MANUAL }
        status: { type: string, enum: [RUNNING, SUCCESS, FAILURE] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        total: { type: integer, nullable: true, description: 拉取到的用户总数 }
        inserted: { type: integer, nullable: true }
        updated: { type: integer, nullable: true }
        skipped: { type: integer, nullable: true }
        errorMessage: { type: string, nullable: true }
    OrgSyncLogPage:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/OrgSyncLogVO' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    JobLogVO:
      type: object
      description: 调度任务执行日志
      properties:
        id: { type: integer, format: int64 }
        job: { type: string, description: 任务名（org-sync / field-cleanup） }
        success: { type: boolean }
        duration: { type: integer, format: int64, description: 耗时 ms }
        message: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
    JobLogPage:
      type: object
      properties:
        list: { type: array, items: { $ref: '#/components/schemas/JobLogVO' } }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
    ConfigItemVO:
      type: object
      description: 单个配置项（前端按 type 渲染控件）
      properties:
        key: { type: string }
        label: { type: string }
        value: { type: string, nullable: true, description: 密文为掩码 `******`，永不返回明文 }
        type: { type: string, enum: [STRING, INT, BOOL, SELECT, JSON] }
        secret: { type: boolean, description: 是否密文项 }
        hasSecret: { type: boolean, description: 库中是否已存在密文值 }
        source: { type: string, enum: [DB, YML, DEFAULT], description: 当前值的实际来源 }
        description: { type: string, nullable: true }
        options: { type: array, items: { type: string }, description: type=SELECT 时的候选项 }
        requiresRestart: { type: boolean, description: 修改后需重启生效 }
    ConfigGroupVO:
      type: object
      description: 配置分组（前端渲染为一张卡片）
      properties:
        group: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        items: { type: array, items: { $ref: '#/components/schemas/ConfigItemVO' } }
    ConfigSaveReq:
      type: object
      required: [values]
      description: key → 新值；值为 null 或掩码表示不修改，空串表示清空
      properties:
        values: { type: object, additionalProperties: { type: string, nullable: true } }
    ConfigTestResult:
      type: object
      description: Casdoor 连通性测试结果
      properties:
        ok: { type: boolean }
        message: { type: string }
        latencyMs: { type: integer, format: int64 }
        issuer: { type: string, nullable: true }
        authorizationEndpoint: { type: string, nullable: true }
        tokenEndpoint: { type: string, nullable: true }
    RefreshReq:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    UserCreateReq:
      type: object
      required: [username, name, deptId]
      properties:
        username: { type: string }
        name: { type: string }
        password: { type: string, format: password, nullable: true, description: 可选；首登 must_change_password 强制改密 }
        deptId: { type: integer, format: int64, description: 必填：新用户必须归属一个部门 }
        roleCode: { type: string, enum: [ADMIN, AUDITOR, USER_MANAGER, COMMON] }
        mobile: { type: string, nullable: true, description: 手机号 }
        email: { type: string, nullable: true, description: 邮箱 }
    UserUpdateReq:
      type: object
      properties:
        name: { type: string }
        deptId: { type: integer, format: int64, nullable: true }
        roleCode: { type: string, enum: [ADMIN, AUDITOR, USER_MANAGER, COMMON] }
        status: { type: string, enum: [ACTIVE, DISABLED] }
        mobile: { type: string, nullable: true, description: 手机号（传空串清空） }
        email: { type: string, nullable: true, description: 邮箱（传空串清空） }
    PasswordUpdateReq:
      type: object
      required: [newPassword]
      properties:
        oldPassword: { type: string, format: password, nullable: true, description: 非首登须提供 }
        newPassword: { type: string, format: password }
    DeptCreateReq:
      type: object
      required: [name]
      properties:
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        leaderId: { type: integer, format: int64, nullable: true }
    DeptUpdateReq:
      type: object
      properties:
        name: { type: string }
        parentId: { type: integer, format: int64, nullable: true }
        leaderId: { type: integer, format: int64, nullable: true }
    TagReq:
      type: object
      required: [name]
      properties:
        name: { type: string }
    MenuReq:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sort: { type: integer }
    MenuItemReq:
      type: object
      required: [taskId]
      properties:
        taskId: { type: integer, format: int64 }
    TaskUpdateReq:
      description: 更新任务（在 TaskCreateReq 基础上 `version` 必填，ADR-013）
      allOf:
        - $ref: '#/components/schemas/TaskCreateReq'
        - type: object
          required: [version]
          properties:
            version: { type: integer, format: int64 }
    TaskCompleteReq:
      type: object
      description: 完成/取消完成请求体（ADR-013：更新须携带 `version`；周期任务需带 `dueAt` 指定实例，见 02 §4.3 R2）
      required: [version]
      properties:
        version: { type: integer, format: int64, description: 乐观锁版本号（失配 code=10006） }
        dueAt: { type: string, format: date-time, nullable: true, description: 周期任务指定实例时间；非周期可空 }
    OrgPushPayload:
      type: object
      description: 私有 IDM 组织推送报文（规范通用形态；厂商私有格式由 OrgPushAdapter 映射）
      required: [departments, users]
      properties:
        type: { type: string, enum: [FULL, INCREMENTAL], default: INCREMENTAL, description: 全量/增量 }
        timestamp: { type: string, format: date-time, nullable: true }
        departments: { type: array, items: { $ref: '#/components/schemas/OrgPushDept' } }
        users: { type: array, items: { $ref: '#/components/schemas/OrgPushUser' } }
        deleted:
          type: object
          description: 需失效（置 DISABLED）的外部 id 列表
          properties:
            userExternalIds: { type: array, items: { type: string } }
            deptExternalIds: { type: array, items: { type: string } }
    OrgPushDept:
      type: object
      required: [externalId, name]
      properties:
        externalId: { type: string, description: 外部源部门 id（幂等映射键） }
        name: { type: string }
        parentExternalId: { type: string, nullable: true }
        leaderExternalId: { type: string, nullable: true, description: 负责人外部用户 id }
        sort: { type: integer, nullable: true }
    OrgPushUser:
      type: object
      required: [externalId]
      properties:
        externalId: { type: string, description: 外部源用户 id（幂等映射键） }
        username: { type: string, nullable: true }
        name: { type: string, nullable: true }
        mobile: { type: string, nullable: true }
        email: { type: string, nullable: true }
        primaryDeptExternalId: { type: string, nullable: true }
        deptExternalIds: { type: array, items: { type: string } }
        status: { type: string, enum: [ACTIVE, DISABLED], default: ACTIVE }
    ScimResource:
      type: object
      additionalProperties: true
      description: SCIM 资源（标准 schema；字段随 IDP 而异，映射见 02 §3.3）
    ScimPatchOp:
      type: object
      required: [Operations]
      properties:
        schemas: { type: array, items: { type: string } }
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, enum: [add, remove, replace] }
              path: { type: string, nullable: true }
              value: { nullable: true }
