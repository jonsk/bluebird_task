# 本地开发覆盖（可选）。默认已可直接 `mvn spring-boot:run`。
spring:
  datasource:
    url: ${SQLITE_URL:jdbc:sqlite:./data/bluebird.db}

logging:
  level:
    com.bbtc.bluebird: debug
    org.springframework.security: info

# 本地联调可开启接口文档
springdoc:
  api-docs:
    enabled: ${DOC_ENABLED:true}
  swagger-ui:
    enabled: ${DOC_ENABLED:true}
