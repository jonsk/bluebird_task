# 仅依赖（本地开发）：PostgreSQL + Redis（ADR-006：PG 13+，按 16 开发）
# 使用：docker compose -f deploy/docker-compose.dev.yml up -d
# 构建单制品见 docker-compose.yml（全量）/ 01 §11。

services:
  postgres:
    image: postgres:16
    container_name: bluebird-pg
    environment:
      POSTGRES_DB: bluebird
      POSTGRES_USER: bluebird
      POSTGRES_PASSWORD: bluebird_dev
    ports:
      - "5432:5432"
    volumes:
      - bluebird_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: bluebird-redis
    ports:
      - "6379:6379"

volumes:
  bluebird_pgdata:
