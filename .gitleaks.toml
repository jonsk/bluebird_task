# gitleaks 配置（M0 骨架基线）
# 文档/配置中不含真实密钥；基线文件 .gitleaks.toml.baseline 随首扫生成并入库，
# 之后新增泄露以 gitleaks detect 门禁拦截（CI 见 01 §11.5）。

title = "BlueBird Task gitleaks config"

[extend]
useDefault = true

# 允许通过默认规则（测试/占位/文档示例不含真实凭证）
[allowlist]
description = "占位符示例与测试用值"
regexes = [
    '''example\.com''',
    '''placeholder''',
    '''your-''',
]
paths = [
    '''docs/frontend-baseline/''',
    '''\.env\.example''',
    '''README\.md''',
    '''_test\.''',
]
